apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend-a
  namespace: full-multi
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: backend-a
  template:
    metadata:
      annotations:
        demo-rollout-revision: candidate-yellow-20261027T205520Z
        prometheus.io/scrape: 'true'
        prometheus.io/port: '15090'
        prometheus.io/path: /stats/prometheus
      labels:
        app: backend-a
        app.kubernetes.io/name: full-multi-bookshelf
        sidecar.istio.io/inject: 'true'
    spec:
      containers:
        - name: bookshelf-backend
          image: ghcr.io/gstephan76/argo-sm-bookshelf:full-multi-tracing-v2
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ID
              value: "A"
            - name: ROLE
              value: "backend"
            - name: MESSAGE_PREFIX
              value: "Application A - YELLOW"
            - name: DB_HOST_STABLE
              value: mariadb-a-stable.full-multi.svc.cluster.local
            - name: DB_HOST_CANARY
              value: mariadb-a-canary.full-multi.svc.cluster.local
            - name: DB_NAME
              value: bookdb
            - name: DB_USER
              value: bookapp
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials-a
                  key: password
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
  strategy:
    canary:
      maxUnavailable: 0
      maxSurge: 1
      stableService: backend-a-stable
      canaryService: backend-a-canary
      trafficRouting:
        istio:
          virtualService:
            name: backend-a-router
            routes:
              - backend-a-default
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: smoke-backend-a
            args:
              - name: expected-color
                value: YELLOW
        - setWeight: 25
        - analysis:
            templates:
              - templateName: smoke-backend-a
            args:
              - name: expected-color
                value: YELLOW
        - setWeight: 50
        - analysis:
            templates:
              - templateName: smoke-backend-a
            args:
              - name: expected-color
                value: YELLOW
        - pause: {}
