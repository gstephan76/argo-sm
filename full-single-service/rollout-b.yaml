apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: full-single-service-b
  namespace: full-single-service
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: full-single-service-b
  template:
    metadata:
      annotations:
        demo-rollout-revision: candidate-yellow-20261019T191724Z
        prometheus.io/scrape: 'true'
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: '15090'
      labels:
        app: full-single-service-b
        app.kubernetes.io/name: argo-sm-greeter
        app.kubernetes.io/instance: full-single-service-b
        sidecar.istio.io/inject: 'true'
    spec:
      containers:
        - name: greeter
          # Quarkus Knative tutorial greeter: per-pod request count included.
          image: ghcr.io/gstephan76/argo-sm-greeter:configmap-v1
          imagePullPolicy: IfNotPresent
          env:
            - name: MESSAGE_PREFIX
              value: "Application B - YELLOW"
            - name: GREETER_INSTANCE_ID
              valueFrom:
                configMapKeyRef:
                  name: full-single-service-b-identity
                  key: GREETER_INSTANCE_ID
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
  strategy:
    canary:
      maxUnavailable: 0
      maxSurge: 1
      stableService: full-single-service-b-stable
      canaryService: full-single-service-b-canary
      trafficRouting:
        istio:
          virtualService:
            name: full-single-service-router
            routes:
              - secondary
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: full-single-service-b-smoke-test
            args:
              - name: expected-color
                value: YELLOW
        - setWeight: 25
        - analysis:
            templates:
              - templateName: full-single-service-b-smoke-test
            args:
              - name: expected-color
                value: YELLOW
        - setWeight: 50
        - analysis:
            templates:
              - templateName: full-single-service-b-smoke-test
            args:
              - name: expected-color
                value: YELLOW
        - setWeight: 75
        - analysis:
            templates:
              - templateName: full-single-service-b-smoke-test
            args:
              - name: expected-color
                value: YELLOW
        - setWeight: 100
        - analysis:
            templates:
              - templateName: full-single-service-b-smoke-test
            args:
              - name: expected-color
                value: YELLOW
        - pause: {} # operator-controlled final promotion
