apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: full-single-service-b
  namespace: full-single-service
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: full-single-service-b
  template:
    metadata:
      annotations:
        demo-rollout-revision: candidate-green-20261012T215144Z
        prometheus.io/scrape: 'true'
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: '15090'
      labels:
        app: full-single-service-b
        app.kubernetes.io/name: rollouts-demo
        app.kubernetes.io/instance: full-single-service-b
        sidecar.istio.io/inject: 'true'
    spec:
      containers:
        - name: rollouts-demo
          # Same single-service application used by old bluegreen-demo.
          image: argoproj/rollouts-demo:green
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
  strategy:
    canary:
      maxUnavailable: 0
      maxSurge: 1
      stableService: full-single-service-b-stable
      canaryService: full-single-service-b-canary
      trafficRouting:
        istio:
          virtualService:
            name: full-single-service-router
            routes:
              - secondary
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: full-single-service-b-smoke-test
            args:
              - name: expected-color
                value: green
        - setWeight: 25
        - analysis:
            templates:
              - templateName: full-single-service-b-smoke-test
            args:
              - name: expected-color
                value: green
        - setWeight: 50
        - analysis:
            templates:
              - templateName: full-single-service-b-smoke-test
            args:
              - name: expected-color
                value: green
        - setWeight: 75
        - analysis:
            templates:
              - templateName: full-single-service-b-smoke-test
            args:
              - name: expected-color
                value: green
        - setWeight: 100
        - analysis:
            templates:
              - templateName: full-single-service-b-smoke-test
            args:
              - name: expected-color
                value: green
        - pause: {} # operator-controlled final promotion
