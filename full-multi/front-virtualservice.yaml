apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: full-multi-front-router
  namespace: full-multi
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  hosts: ["*"]
  gateways: [full-multi-gateway]
  http:
    # Must come first; requests for B are never handled by default A.
    - name: application-b
      match:
        - headers:
            x-app-target:
              exact: b
      delegate:
        name: front-b-router
    # Preserve old semantics: absent/unknown x-app-target selects A.
    - name: application-a-default
      delegate:
        name: front-a-router
