apiVersion: v1
kind: Service
metadata:
  name: full-multi-ingressgateway
  namespace: full-multi
spec:
  selector:
    istio: ingressgateway
    app.kubernetes.io/component: full-multi-ingressgateway
  ports:
    - name: http2
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: full-multi-ingressgateway
  namespace: full-multi
spec:
  replicas: 1
  selector:
    matchLabels:
      istio: ingressgateway
      app.kubernetes.io/component: full-multi-ingressgateway
  template:
    metadata:
      annotations:
        inject.istio.io/templates: gateway
        prometheus.io/scrape: 'true'
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: '15090'
      labels:
        istio: ingressgateway
        app.kubernetes.io/component: full-multi-ingressgateway
        sidecar.istio.io/inject: 'true'
    spec:
      containers:
        - name: istio-proxy
          image: auto
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: full-multi-gateway
  namespace: full-multi
spec:
  selector:
    istio: ingressgateway
    app.kubernetes.io/component: full-multi-ingressgateway
  servers:
    - port:
        number: 8080
        name: http
        protocol: HTTP
      hosts: ['*']
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: full-multi
  namespace: full-multi
spec:
  to:
    kind: Service
    name: full-multi-ingressgateway
  port:
    targetPort: http2
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
