apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: full-single-service-b-smoke-test
  namespace: full-single-service
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  args:
    - name: expected-color
  metrics:
    - name: candidate-greeting-and-counter
      count: 1
      failureLimit: 0
      provider:
        job:
          metadata:
            labels:
              app: full-single-service-b-analysis
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 60
            template:
              metadata:
                labels:
                  app: full-single-service-b-analysis
                  sidecar.istio.io/inject: 'false'
              spec:
                restartPolicy: Never
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: smoke-test
                    image: quay.io/curl/curl:8.22.0
                    imagePullPolicy: IfNotPresent
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                      runAsNonRoot: true
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu
                        url=http://full-single-service-b-canary.full-single-service.svc.cluster.local/
                        expected='Application B - {{args.expected-color}}'
                        case "{{args.expected-color}}" in
                          BLUE|YELLOW) ;;
                          *) echo 'Unsupported expected color' >&2; exit 1 ;;
                        esac
                        n=1
                        while [ "$n" -le 15 ]; do
                          got="$(curl --fail --silent --show-error --max-time 8 "$url")"
                          # Prefix identifies this application and the selected color.
                          # Last colon-separated number is the greeter's per-pod counter.
                          printf '%s\n' "$got" | grep -Eq '^Application B - {{args.expected-color}}[[:space:]].*:[[:space:]]*[0-9]+$' || {
                            echo "Unexpected greeter reply: $got" >&2
                            exit 1
                          }
                          echo "Probe $n: $got"
                          n=$((n + 1))
                          sleep 1
                        done
