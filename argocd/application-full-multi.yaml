apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-ambient
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/gstephan76/argo-sm.git
    targetRevision: multi-ambient
    path: full-multi
  destination:
    server: https://kubernetes.default.svc
    namespace: multi-ambient
  ignoreDifferences:
    - group: ""
      kind: Service
      jqPathExpressions:
        - '.spec.selector."rollouts-pod-template-hash"'
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: multi-ambient
      jqPathExpressions:
        - '.spec.rules[].backendRefs[] | select(.name == "front-a-stable" or .name == "front-a-canary" or .name == "front-b-stable" or .name == "front-b-canary" or .name == "backend-a-stable" or .name == "backend-a-canary" or .name == "backend-b-stable" or .name == "backend-b-canary") | .weight'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
