apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: full-multi-front-router
  namespace: multi-ambient
spec:
  parentRefs:
  - name: full-multi-gateway
  rules:
  - matches:
    - headers:
      - name: x-app-target
        value: b
      - name: x-front-track
        value: canary
    backendRefs:
    - name: front-b-canary
      port: 80
  - matches:
    - headers:
      - name: x-app-target
        value: b
      - name: x-front-track
        value: stable
    backendRefs:
    - name: front-b-stable
      port: 80
  - matches:
    - headers:
      - name: x-app-target
        value: b
    backendRefs:
    - name: front-b-stable
      port: 80
      weight: 50
    - name: front-b-canary
      port: 80
      weight: 50
  - matches:
    - headers:
      - name: x-front-track
        value: canary
    backendRefs:
    - name: front-a-canary
      port: 80
  - matches:
    - headers:
      - name: x-front-track
        value: stable
    backendRefs:
    - name: front-a-stable
      port: 80
  - backendRefs:
    - name: front-a-stable
      port: 80
      weight: 50
    - name: front-a-canary
      port: 80
      weight: 50
