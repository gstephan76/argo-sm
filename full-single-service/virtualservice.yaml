apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: full-single-service-router
  namespace: full-single-service
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  hosts:
    - '*'
  gateways:
    - full-single-service-gateway
  http:
    # The B match MUST precede primary's default catch-all.
    # The route names are still owned by their respective Argo Rollouts.
    - name: secondary
      match:
        - headers:
            x-app-target:
              exact: b
          uri:
            prefix: /
      route:
        - destination:
            host: full-single-service-b-stable
            port:
              number: 80
          weight: 100
        - destination:
            host: full-single-service-b-canary
            port:
              number: 80
          weight: 0
    - name: primary
      # Missing header, explicit A, or any other value defaults to A.
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: full-single-service-a-stable
            port:
              number: 80
          weight: 100
        - destination:
            host: full-single-service-a-canary
            port:
              number: 80
          weight: 0
