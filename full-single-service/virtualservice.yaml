apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: full-single-service-router
  namespace: full-single-service
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  hosts:
    - '*'
  gateways:
    - full-single-service-gateway
  http:
    - name: primary
      match:
        - authority:
            regex: '^full-single-service-full-single-service\..*$'
          uri:
            prefix: /
      route:
        - destination:
            host: full-single-service-stable
            port:
              number: 80
          weight: 100
        - destination:
            host: full-single-service-canary
            port:
              number: 80
          weight: 0
    - name: secondary
      match:
        - authority:
            regex: '^full-single-service-b-full-single-service\..*$'
          uri:
            prefix: /
      route:
        - destination:
            host: full-single-service-b-stable
            port:
              number: 80
          weight: 100
        - destination:
            host: full-single-service-b-canary
            port:
              number: 80
          weight: 0
