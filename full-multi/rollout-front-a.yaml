apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: front-a
  namespace: full-multi
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  analysis:
    successfulRunHistoryLimit: 2
    unsuccessfulRunHistoryLimit: 2
  selector:
    matchLabels:
      app: front-a
  template:
    metadata:
      annotations:
        demo-rollout-revision: candidate-yellow-20261028T131920Z
        prometheus.io/scrape: 'true'
        prometheus.io/port: '15090'
        prometheus.io/path: /stats/prometheus
      labels:
        app: front-a
        app.kubernetes.io/name: full-multi-bookshelf
        sidecar.istio.io/inject: 'true'
    spec:
      containers:
        - name: bookshelf-front
          image: ghcr.io/gstephan76/argo-sm-bookshelf:full-multi-crud-v3
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ID
              value: "A"
            - name: ROLE
              value: "front"
            - name: MESSAGE_PREFIX
              value: "Application A - YELLOW"
            - name: BACKEND_API_URL
              value: "http://backend-a-stable.full-multi.svc.cluster.local:5000/api/books"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
  strategy:
    canary:
      maxUnavailable: 0
      maxSurge: 1
      stableService: front-a-stable
      canaryService: front-a-canary
      trafficRouting:
        istio:
          virtualService:
            name: full-multi-front-router
            routes:
              - primary
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: smoke-front-a
            args:
              - name: expected-color
                value: YELLOW
        - setWeight: 25
        - analysis:
            templates:
              - templateName: smoke-front-a
            args:
              - name: expected-color
                value: YELLOW
        - setWeight: 50
        - analysis:
            templates:
              - templateName: smoke-front-a
            args:
              - name: expected-color
                value: YELLOW
        - pause: {}
