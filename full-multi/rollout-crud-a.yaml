apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: crud-a
  namespace: full-multi
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 3
  analysis:
    successfulRunHistoryLimit: 2
    unsuccessfulRunHistoryLimit: 2
  selector:
    matchLabels:
      app: crud-a
  template:
    metadata:
      annotations:
        demo-rollout-revision: baseline-blue
      labels:
        app: crud-a
        demo.crud-track: blue
        app.kubernetes.io/name: full-multi-crud
        sidecar.istio.io/inject: 'true'
    spec:
      containers:
        - name: crud
          image: ghcr.io/gstephan76/argo-sm-bookshelf:full-multi-crud-v5
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ID
              value: "A"
            - name: ROLE
              value: crud
            - name: MESSAGE_PREFIX
              value: "Application A - CRUD"
            - name: DB_HOST
              value: mariadb-a-blue.full-multi.svc.cluster.local
            - name: DB_TRACK
              value: blue
            - name: DB_NAME
              value: bookdb
            - name: DB_USER
              value: bookapp
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials-a
                  key: password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
  strategy:
    blueGreen:
      activeService: crud-a-active
      previewService: crud-a-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 300
