apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-b-router
  namespace: multi-ambient
spec:
  parentRefs:
  - group: ''
    kind: Service
    name: backend-b-stable
  rules:
  - matches:
    - headers:
      - name: x-backend-track
        value: canary
    backendRefs:
    - name: backend-b-canary
      port: 5000
  - matches:
    - headers:
      - name: x-backend-track
        value: stable
    backendRefs:
    - name: backend-b-stable
      port: 5000
  - backendRefs:
    - name: backend-b-stable
      port: 5000
      weight: 100
    - name: backend-b-canary
      port: 5000
      weight: 0
