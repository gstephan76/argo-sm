# Explicit language routes select actual CRUD revision pods. The default uses
# the Rollout-managed active Service, which follows BlueGreen promotion.
# A fixed blue/green route may have no endpoints after old-revision scale-down.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: crud-a-router
  namespace: full-multi
spec:
  hosts:
    - crud-a-blue.full-multi.svc.cluster.local
  gateways: [mesh]
  http:
    - name: crud-a-green
      match:
        - headers:
            x-db-track:
              exact: green
        - headers:
            x-db-track:
              exact: canary
      route:
        - destination:
            host: crud-a-green.full-multi.svc.cluster.local
            port:
              number: 8080
    - name: crud-a-blue
      match:
        - headers:
            x-db-track:
              exact: blue
        - headers:
            x-db-track:
              exact: stable
      route:
        - destination:
            host: crud-a-blue.full-multi.svc.cluster.local
            port:
              number: 8080
    - name: crud-a-active-default
      route:
        - destination:
            host: crud-a-active.full-multi.svc.cluster.local
            port:
              number: 8080
