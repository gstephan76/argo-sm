apiVersion: v1
kind: Service
metadata:
  name: full-single-service-ingressgateway
  namespace: full-single-service
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  labels:
    istio: ingressgateway
    app.kubernetes.io/component: full-single-service-ingressgateway
spec:
  type: ClusterIP
  selector:
    istio: ingressgateway
    app.kubernetes.io/component: full-single-service-ingressgateway
  ports:
    - name: http2
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: full-single-service-ingressgateway
  namespace: full-single-service
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  selector:
    matchLabels:
      istio: ingressgateway
      app.kubernetes.io/component: full-single-service-ingressgateway
  template:
    metadata:
      annotations:
        inject.istio.io/templates: gateway
        prometheus.io/scrape: 'true'
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: '15090'
      labels:
        istio: ingressgateway
        app.kubernetes.io/component: full-single-service-ingressgateway
        sidecar.istio.io/inject: 'true'
    spec:
      containers:
        - name: istio-proxy
          image: auto
